name: Switch food-market destination
run-name: Food-market destination → ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: primary = app, backup = new QRQ queue, backup-old = old QRQ queue
        type: choice
        required: true
        options:
          - backup
          - backup-old
          - primary

permissions:
  contents: write

concurrency:
  group: food-market-mode
  cancel-in-progress: false

jobs:
  switch:
    name: Switch and request deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ inputs.mode }}
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
    steps:
      - name: Check build hook is configured
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo '::error::Add the NETLIFY_BUILD_HOOK_URL repository secret before switching.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Run tests
        run: node --test scripts/*.test.mjs
      - name: Switch and validate
        run: |
          node scripts/food-market-mode.mjs "$MODE"
          node scripts/validate.mjs
          git diff --check
      - name: Commit selected mode
        run: |
          if ! git diff --quiet -- public/_redirects; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/_redirects
            git commit -m "Switch food-market redirects to $MODE"
            git push origin HEAD:main
          fi
      - name: Request Netlify deployment
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --request POST --data '{}' "$NETLIFY_BUILD_HOOK_URL"
          echo "### Food-market mode: $MODE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Netlify deployment requested. Check Netlify for successful publication, then test a public redirect. This run does not wait for deployment.' >> "$GITHUB_STEP_SUMMARY"
